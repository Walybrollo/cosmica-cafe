name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Configuración de Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
          if [ ! -f app/google-services.json ]; then
            echo "::warning::Falta app/google-services.json: la app va a pedir que se configure Firebase."
          fi
      - run: chmod +x gradlew && ./gradlew assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk CosmicaCafe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cosmica-cafe-apk
          path: CosmicaCafe.apk
      # Publica el APK en "Releases" para bajarlo directo desde el teléfono.
      - name: Publicar versión para descargar
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-version --yes --cleanup-tag || true
          gh release create ultima-version CosmicaCafe.apk \
            --title "Cósmica Café (última versión)" \
            --notes "APK compilado el $(date -u +'%d/%m/%Y %H:%M') UTC desde ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
